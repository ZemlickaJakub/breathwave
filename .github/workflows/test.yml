name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prostředí
        run: |
          sw_vers
          xcodebuild -version

      # Jméno simulátoru se mění s verzí Xcode na runneru, proto se vybírá
      # první dostupný iPhone, ne napevno zapsaný model.
      - name: Výběr simulátoru
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Breathwave \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Výsledky
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
          retention-days: 14
